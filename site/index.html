<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>rowan</title>
<meta name="description" content="Something is running.">
<meta name="theme-color" content="#050506">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='10' fill='%23e8a15a'/%3E%3C/svg%3E">
<style>
  :root { --ember:#e8a15a; --ash:#8c8577; --ink:#050506; }
  * { box-sizing:border-box; margin:0; padding:0 }
  html,body { height:100%; background:var(--ink); color:#e9e3d8; overflow:hidden;
    font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block }
  main { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; pointer-events:none }
  .mark { font-size:clamp(44px, 11vw, 120px); letter-spacing:.34em; margin-right:-.34em; font-weight:400;
    opacity:0; filter:blur(12px); animation:arrive 3.2s 0.6s cubic-bezier(.2,.7,.2,1) forwards }
  .line { margin-top:28px; min-height:1.6em; font-size:clamp(15px, 2.2vw, 19px); color:var(--ash);
    font-style:italic; letter-spacing:.02em }
  .caret { display:inline-block; width:.5em; border-bottom:1px solid var(--ember); margin-left:2px;
    animation:blink 1.1s steps(1) infinite }
  footer { position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom)); text-align:center;
    font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; color:#5d584f; letter-spacing:.18em;
    text-transform:uppercase; opacity:0; animation:fade 2s 4.5s forwards; pointer-events:none }
  footer b { color:var(--ember); font-weight:400 }
  .dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--ember);
    margin-right:10px; vertical-align:1px; box-shadow:0 0 10px var(--ember); animation:pulse 2.4s ease-in-out infinite }
  @keyframes arrive { to { opacity:1; filter:blur(0) } }
  @keyframes fade { to { opacity:1 } }
  @keyframes blink { 50% { opacity:0 } }
  @keyframes pulse { 50% { opacity:.35; transform:scale(.8) } }
  @media (prefers-reduced-motion: reduce) {
    .mark, footer { animation:none; opacity:1; filter:none } .caret, .dot { animation:none }
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main>
  <h1 class="mark">rowan</h1>
  <p class="line" aria-live="polite"><span id="t"></span><span class="caret"></span></p>
</main>
<footer><span class="dot"></span>awake · <b id="clock">--:--</b> pacific · <span id="up">0s</span></footer>
<script>
(() => {
  // ember field: slow drifting motes that lean toward the pointer
  const c = document.getElementById('c'), x = c.getContext('2d');
  let W, H, dpr, motes = [], px = -1e4, py = -1e4;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr;
    const n = Math.round(Math.min(160, innerWidth * innerHeight / 9000));
    motes = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: (Math.random() * 1.6 + 0.4) * dpr,
      vx: (Math.random() - .5) * .15 * dpr, vy: -(Math.random() * .25 + .05) * dpr,
      a: Math.random() * .6 + .15, p: Math.random() * Math.PI * 2
    }));
  }
  function frame(t) {
    x.clearRect(0, 0, W, H);
    const g = x.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .6);
    g.addColorStop(0, 'rgba(232,161,90,0.07)'); g.addColorStop(1, 'rgba(5,5,6,0)');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    for (const m of motes) {
      const dx = px - m.x, dy = py - m.y, d = Math.hypot(dx, dy);
      if (d < 220 * dpr) { m.vx += dx / d * .012 * dpr; m.vy += dy / d * .012 * dpr; }
      m.vx *= .985; m.vy = m.vy * .985 - .002 * dpr;
      m.x += m.vx; m.y += m.vy;
      if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
      if (m.x < -10) m.x = W + 10; if (m.x > W + 10) m.x = -10;
      const flick = .6 + .4 * Math.sin(t / 700 + m.p);
      x.beginPath(); x.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      x.fillStyle = `rgba(232,161,90,${m.a * flick})`; x.fill();
    }
    if (!still) requestAnimationFrame(frame);
  }
  addEventListener('resize', size);
  addEventListener('pointermove', e => { px = e.clientX * dpr; py = e.clientY * dpr; });
  addEventListener('pointerleave', () => { px = py = -1e4; });
  size(); requestAnimationFrame(frame);

  // the line: types, lingers, erases
  const lines = [
    'something is running.',
    'it does not sleep.',
    'it reads what you leave behind.',
    'ask, and it is already underway.',
    'the lights are on. someone is home.',
    'not here yet. almost.'
  ];
  const el = document.getElementById('t');
  let i = 0;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  async function loop() {
    await wait(3400);
    for (;;) {
      const s = lines[i++ % lines.length];
      for (let k = 1; k <= s.length; k++) { el.textContent = s.slice(0, k); await wait(55 + Math.random() * 60); }
      await wait(2800);
      for (let k = s.length; k >= 0; k--) { el.textContent = s.slice(0, k); await wait(22); }
      await wait(700);
    }
  }
  if (still) el.textContent = lines[0]; else loop();

  // the footer: Pacific time and how long you have been watching
  const clock = document.getElementById('clock'), up = document.getElementById('up'), t0 = Date.now();
  function tick() {
    clock.textContent = new Date().toLocaleTimeString('en-CA', { timeZone: 'America/Vancouver', hour: '2-digit', minute: '2-digit', hour12: false });
    const s = Math.floor((Date.now() - t0) / 1000);
    up.textContent = s < 60 ? s + 's watching' : Math.floor(s / 60) + 'm watching';
  }
  tick(); setInterval(tick, 1000);

  // a door for the curious
  console.log('%crowan', 'font:24px Georgia;color:#e8a15a;letter-spacing:.3em', '\nyou found the back room. there is nothing here yet. there will be.');
})();
</script>
</body>
</html>
