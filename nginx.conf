# go.rowan.run exists only for the Go iOS app's universal links (IOS-53, 2026-10-31).
# iOS fetches the AASA file here; every other path bounces back to the private
# tailnet link with ?web=1 so the go/ resolver serves the web page, never a loop.
server {
  listen 80;
  server_name go.rowan.run;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  root /usr/share/nginx/html;
  location = /.well-known/apple-app-site-association { default_type application/json; try_files $uri =404; }
  location = /healthz { access_log off; return 200 "ok\n"; }
  location / {
    set $sep "?";
    if ($args) { set $sep "?$args&"; }
    return 302 http://go$uri${sep}web=1;
  }
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  location / { try_files $uri $uri/ /index.html; }
  location = /.well-known/apple-app-site-association { default_type application/json; try_files $uri =404; }
  location = /healthz { access_log off; return 200 "ok\n"; }
}
